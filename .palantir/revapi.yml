      justification: "ConjureProductDependenciesExtension has been modernised to use\
        \ Gradle best practices, this has come from a desire to make it configuration\
        \ cache friendly, the changes to serviceDependency and endpointVersion should\
        \ have no impact as gradle will implement the closure method for the action,\
